name: zhenwu-linux-test

on:
  workflow_dispatch:
    inputs:
      pytorch-ref:
        description: test_transformers.py
        type: string
        default: v2.10.0
      ccache-maxsize:
        description: ccache maxsize
        type: string
        default: "2G"
  pull_request:
    branches:
      - v0.0.27
    paths:
      - '.github/workflows/**'
      - 'xformers/csrc/**'
      - 'third_party/**'
      - 'setup.py'
      - 'CMakeLists.txt'
      - 'requirements.txt'
  push:
    branches:
      - v0.0.27
    paths:
      - '.github/workflows/**'
      - 'xformers/csrc/**'
      - 'third_party/**'
      - 'setup.py'
      - 'CMakeLists.txt'
      - 'requirements.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
  NAMESPACE: ppu-sched
  HOST_VOLUMES: "/nas_aisw:/nas_aisw,/wl_nas:/mnt/wl_nas"
  SOURCE_DIR: /workspace/source
  NODE_SELECTOR: "board-type=OAM-810E"
  PIP_INDEX: https://download.t-head.cn/artifactory/api/pypi/pypi_index/simple
  TRITON_VERSION: "3.6.0"
  WHEEL_DIR_REL: .ci/ppu/wheelhouse

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build xformers into torch (${{ matrix.board }})
    strategy:
      fail-fast: false
      matrix:
        board: ["810"]
    runs-on: ubuntu-24.04
    timeout-minutes: 400
    outputs:
      artifact-name: ${{ steps.collect.outputs.artifact-name }}
      wheel-name: ${{ steps.collect.outputs.wheel-name }}
    env:
      BUILD_ENVIRONMENT: ppu-linux-ubuntu24.04-py3.12-${{ matrix.board }}
      DOCKER_IMAGE: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
      MAX_JOBS: "8"
      PPU_MEM_PER_JOB_GB: "4"
      CCACHE_MAXSIZE: ${{ inputs.ccache-maxsize || '2G' }}
      SDK_INSTALL_DIR: /usr/local
      PIP_INDEX_URL: ""
      BUILD_ADDITIONAL_PACKAGES: ""
      REPO_DIR_IN_CONTAINER: /pytorch
      PYTORCH_REF: ${{ inputs.pytorch-ref || 'v2.10.0' }}

    steps:
      - name: Show runner spec
        run: |
          echo "[spec] runner-name=${RUNNER_NAME} os=${RUNNER_OS} arch=${RUNNER_ARCH}"
          echo "[spec] nproc=$(nproc) mem=$(free -g | awk '/^Mem:/{print $2}')GB"
          echo "[spec] event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} pytorch-ref=${PYTORCH_REF}"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Checkout xformers (current PR)
        id: checkout-xf
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: xformers-src
          submodules: recursive
          fetch-depth: 1

      - name: retry1 (xformers checkout)
        if: steps.checkout-xf.outcome == 'failure'
        run: sleep 15

      - name: Checkout xformers (current PR)
        if: steps.checkout-xf.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          path: xformers-src
          submodules: recursive
          fetch-depth: 1
      - name: Checkout pytorch-for-sail
        id: checkout-pt
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: t-head/pytorch-for-sail
          ref: ${{ env.PYTORCH_REF }}
          path: pytorch
          submodules: recursive
          fetch-depth: 1

      - name: retry2 (pytorch checkout)
        if: steps.checkout-pt.outcome == 'failure'
        run: sleep 15

      - name: Checkout pytorch-for-sail
        if: steps.checkout-pt.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: t-head/pytorch-for-sail
          ref: ${{ env.PYTORCH_REF }}
          path: pytorch
          submodules: recursive
          fetch-depth: 1
      - name: Swap in current PR's xformers
        run: |
          set -euo pipefail
          DEST="${GITHUB_WORKSPACE}/pytorch/third_party/xformers"
          SRC="${GITHUB_WORKSPACE}/xformers-src"

          echo "[swap] Remove the third_party/xformers bundled with pytorch"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"

          echo "[swap] Copy in the current PR's xformers source (excluding .git metadata)"
          rsync -a --exclude '.git' "${SRC}/" "${DEST}/"

          echo "[swap] Verify key paths exist"
          test -d "${DEST}/xformers/csrc" || { echo "::error::xformers/csrc missing after swap"; exit 1; }
          test -d "${DEST}/third_party/cutlass" || echo "::warning::xformers/third_party/cutlass is empty; if the build needs it, check the submodule checkout"
          echo "[swap] Done. Directory overview after swap:"
          ls -la "${DEST}" | head -20

      - name: Record baseline commits
        id: baseline
        run: |
          XF_COMMIT=$(git -C "${GITHUB_WORKSPACE}/xformers-src" rev-parse --short=7 HEAD)
          PT_COMMIT=$(git -C "${GITHUB_WORKSPACE}/pytorch" rev-parse --short=7 HEAD)
          echo "xf-commit=${XF_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "pt-commit=${PT_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "[baseline] xformers=${XF_COMMIT} pytorch=${PT_COMMIT}"

      - name: Compute cache metadata
        id: cache-meta
        env:
          CACHE_BRANCH: ${{ github.ref_name }}
        run: |
          branch_slug=$(printf '%s' "${CACHE_BRANCH}" | tr -c '[:alnum:]._-' '-')
          fingerprint=$(
            printf '%s\n' "${DOCKER_IMAGE}" | sha256sum | cut -c1-12
          )
          # Must strictly align with the cache-seeding prefix in ppu-build-refresh-cache.yml to hit the baseline seeded by the writer
          prefix="ppu-ccache-${BUILD_ENVIRONMENT}-${branch_slug}-${fingerprint}-"
          echo "restore-prefix=${prefix}" >> "$GITHUB_OUTPUT"
          # Fallback prefix: when this branch has not been seeded with a baseline by refresh-cache, fall back to the latest baseline of any branch on the same board type
          echo "fallback-prefix=ppu-ccache-${BUILD_ENVIRONMENT}-" >> "$GITHUB_OUTPUT"
          echo "[cache] branch=${CACHE_BRANCH} restore-prefix=${prefix}"

      - name: Free disk space
        run: |
          avail_gb=$(df -Pk / | awk 'NR==2 {print int($4 / 1024 / 1024)}')
          echo "[disk] Root partition available ${avail_gb}GB"
          if [[ "${avail_gb}" -ge 150 ]]; then
            echo "[disk] Enough space, skipping cleanup"
            exit 0
          fi
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell /usr/share/swift \
                      /usr/share/miniconda /usr/local/lib/node_modules \
                      /usr/local/share/chromium /usr/local/share/boost \
                      /usr/lib/google-cloud-sdk /usr/lib/jvm /opt/hostedtoolcache || true
          $SUDO apt-get clean || true
          $SUDO docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Restore ccache baseline
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ppu-ccache
          key: ${{ steps.cache-meta.outputs.restore-prefix }}
          restore-keys: |
            ${{ steps.cache-meta.outputs.restore-prefix }}
            ${{ steps.cache-meta.outputs.fallback-prefix }}

      - name: Report ccache state
        run: |
          if [[ -n "${{ steps.restore-ccache.outputs.cache-matched-key }}" ]]; then
            echo "[cache] Baseline hit key=${{ steps.restore-ccache.outputs.cache-matched-key }}, this round uses incremental build"
          else
            echo "[cache] No baseline hit (this branch has not been seeded by refresh-cache?), this round uses cold build"
          fi

      - name: Add swap
        continue-on-error: true
        run: |
          if [[ -n "$(swapon --show --noheadings 2>/dev/null)" ]]; then
            echo "[swap] swap already exists, skipping"; swapon --show; exit 0
          fi
          swap_file=/mnt/ppu-swapfile
          [[ -d /mnt ]] || swap_file=/ppu-swapfile
          sudo fallocate -l 16G "${swap_file}" \
            || sudo dd if=/dev/zero of="${swap_file}" bs=1M count=16384 status=none
          sudo chmod 600 "${swap_file}"
          sudo mkswap "${swap_file}" >/dev/null
          sudo swapon "${swap_file}"
          sudo sysctl -w vm.swappiness=10 >/dev/null
          free -h

      - name: Pull docker image
        run: |
          for attempt in 1 2 3; do
            if docker pull "${DOCKER_IMAGE}"; then
              exit 0
            fi
            echo "[pull] Attempt ${attempt} failed, retrying in 60s" >&2
            sleep 60
          done
          echo "::error::Failed to pull ${DOCKER_IMAGE}"
          exit 1

      - name: Start build container
        id: container
        env:
          SOURCE_COMMIT: ${{ steps.baseline.outputs.pt-commit }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ppu-ccache"
          container_name=$(docker run \
            --detach --tty --entrypoint /bin/bash \
            -e REPO_DIR="${REPO_DIR_IN_CONTAINER}" \
            -e BUILD_ENVIRONMENT \
            -e MAX_JOBS \
            -e SDK_INSTALL_DIR \
            -e PIP_INDEX_URL \
            -e BUILD_ADDITIONAL_PACKAGES \
            -e PPU_MEM_PER_JOB_GB \
            -e PPU_LINK_JOBS \
            -e CCACHE_DIR=/root/.cache/ccache \
            -e CCACHE_MAXSIZE \
            --security-opt seccomp=unconfined \
            --cap-add=SYS_PTRACE \
            -v "${GITHUB_WORKSPACE}/pytorch:${REPO_DIR_IN_CONTAINER}" \
            -v "${RUNNER_TEMP}/ppu-ccache:/root/.cache/ccache" \
            -w "${REPO_DIR_IN_CONTAINER}" \
            "${DOCKER_IMAGE}" \
            -c 'sleep 12h'
          )
          echo "container-name=${container_name}" >> "$GITHUB_OUTPUT"

          # The mounted source ownership differs from the container user; relax git safe.directory
          docker exec -t "${container_name}" bash -c \
            "git config --global --add safe.directory ${REPO_DIR_IN_CONTAINER} \
             && git config --global --add safe.directory '*'"
          # build_wheel.sh reads this file first as the stamp key
          docker exec -t "${container_name}" bash -c \
            "echo '${SOURCE_COMMIT}' > /tmp/ppu_source_commit"

      - name: Build PPU torch wheel (with swapped xformers)
        id: build
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          mem_log="${RUNNER_TEMP}/mem-samples.log"
          ( while true; do
              printf '%s %s\n' "$(date -u +%H:%M:%S)" \
                "$(free -m | awk '/^Mem:/{printf "used=%sMB avail=%sMB ", $3, $7} /^Swap:/{printf "swap=%sMB", $3}')" \
                >> "${mem_log}"
              sleep 30
            done ) &
          sampler_pid=$!
          # shellcheck disable=SC2064
          trap "kill ${sampler_pid} 2>/dev/null || true" EXIT

          set +e
          docker exec -t "${CONTAINER_NAME}" bash .ci/ppu/build_wheel.sh
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            if [[ "${rc}" -eq 137 ]]; then
              echo "::error::Build process was SIGKILLed (exit 137), almost certainly host OOM"
              echo "[oom] MAX_JOBS=${MAX_JOBS} PPU_LINK_JOBS=${PPU_LINK_JOBS}; lower them first if this keeps happening" >&2
              tail -10 "${mem_log}" 2>/dev/null || true
            fi
            exit "${rc}"
          fi

      - name: Dump OOM diagnostics
        if: failure()
        continue-on-error: true
        run: |
          echo "=== dmesg OOM ==="
          sudo dmesg -T 2>/dev/null | grep -iE "out of memory|killed process|oom-kill" | tail -30 \
            || echo "(no dmesg permission or OOM not recorded)"
          free -h; df -h /
          tail -40 "${RUNNER_TEMP}/mem-samples.log" 2>/dev/null || echo "(no sampling data)"

      - name: Collect wheel
        id: collect
        env:
          XF_COMMIT: ${{ steps.baseline.outputs.xf-commit }}
          PT_COMMIT: ${{ steps.baseline.outputs.pt-commit }}
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO chown -R "$(id -u):$(id -g)" pytorch/dist 2>/dev/null || true

          shopt -s nullglob
          whls=(pytorch/dist/torch-*.whl)
          if [[ ${#whls[@]} -eq 0 ]]; then
            echo "::error::No torch-*.whl under pytorch/dist"
            ls -la pytorch/dist 2>/dev/null || echo "pytorch/dist does not exist"
            exit 1
          fi
          wheel_name=$(basename "${whls[0]}")
          env_slug=$(printf '%s' "${BUILD_ENVIRONMENT}" | tr -c '[:alnum:]._-' '-')
          echo "wheel-name=${wheel_name}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=ppu-torch-xf-${env_slug}-xf${XF_COMMIT}-pt${PT_COMMIT}" >> "$GITHUB_OUTPUT"
          {
            echo "### PPU torch build (with the current PR's xformers swapped in)"
            echo ""
            echo "- Image: \`${DOCKER_IMAGE}\`"
            echo "- Board: \`${{ matrix.board }}\`"
            echo "- xformers commit: \`${XF_COMMIT}\`"
            echo "- pytorch-for-sail: \`${PYTORCH_REF}\` @ \`${PT_COMMIT}\`"
            echo "- whl: \`${wheel_name}\` ($(du -h "${whls[0]}" | cut -f1))"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.artifact-name }}
          path: pytorch/dist/torch-*.whl
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Teardown container
        if: always() && steps.container.outputs.container-name != ''
        continue-on-error: true
        env:
          CONTAINER_NAME: ${{ steps.container.outputs.container-name }}
        run: |
          docker rm -f "${CONTAINER_NAME}" || true
          df -h /

  test:
    name: ppu-test-transformers (810E single card)
    needs: build
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 180
    env:
      PYTORCH_REF: ${{ inputs.pytorch-ref || 'v2.10.0' }}

    steps:
      - name: Checkout pytorch-for-sail
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: t-head/pytorch-for-sail
          ref: ${{ env.PYTORCH_REF }}
          fetch-depth: 1

      - name: Wait before retry (checkout 1)
        if: steps.checkout.outcome == 'failure'
        run: sleep 15

      - name: Checkout pytorch-for-sail (retry 1)
        id: checkout-retry-1
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: t-head/pytorch-for-sail
          ref: ${{ env.PYTORCH_REF }}
          fetch-depth: 1

      - name: Wait before retry (checkout 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        run: sleep 15

      - name: Checkout pytorch-for-sail (retry 2)
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry-1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: t-head/pytorch-for-sail
          ref: ${{ env.PYTORCH_REF }}
          fetch-depth: 1

      - name: Download whl artifact
        id: download-wheel
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Clean up before retry (1)
        if: steps.download-wheel.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          # v4 downloads and extracts at the same time; an interruption midway may leave a truncated whl. If not cleaned up,
          # after retry the "verify whl" step may count a bad package, which only blows up at pip install inside the pod (by then it already holds a PPU card).
          rm -rf "${WHEEL_DIR}"
          sleep 30

      - name: Download whl artifact (retry 1)
        id: download-wheel-retry-1
        if: steps.download-wheel.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Clean up before retry (2)
        if: steps.download-wheel.outcome == 'failure' && steps.download-wheel-retry-1.outcome == 'failure'
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
        run: |
          rm -rf "${WHEEL_DIR}"
          sleep 60

      - name: Download whl artifact (retry 2)
        if: steps.download-wheel.outcome == 'failure' && steps.download-wheel-retry-1.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.WHEEL_DIR_REL }}

      - name: Verify whl is in place
        env:
          WHEEL_DIR: ${{ env.WHEEL_DIR_REL }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=0
          wheel=""
          for f in "${WHEEL_DIR}"/torch-*.whl; do
            # When the glob has no match, sh keeps the pattern string as-is; use -e to filter out this non-existent literal (equivalent to nullglob)
            [ -e "$f" ] || continue
            count=$((count + 1))
            wheel="$f"
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 torch-*.whl under ${WHEEL_DIR}, got ${count}"
            ls -la "${WHEEL_DIR}" 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          wheel_name=$(basename "$wheel")
          echo "[wheel] ${wheel_name} ($(du -h "$wheel" | cut -f1))"
          {
            echo "### whl under test"
            echo ""
            echo "- Package: \`${wheel_name}\`"
            echo "- Source: ${BUILD_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "810 run test cases"
        uses: t-head/ppu-scheduler-action@main
        with:
          nnodes: 0
          nproc_per_node: 1
          node_selector: ${{ env.NODE_SELECTOR }}
          host_volumes: ${{ env.HOST_VOLUMES }}
          image: ${{ env.IMAGE }}
          namespace: ${{ env.NAMESPACE }}
          source_dir: ${{ env.SOURCE_DIR }}
          timeout_minutes: 120

          command: |
            bash <<'PPU_TRANSFORMERS_TEST'
            set -uo pipefail
            export SDK_INSTALL_DIR="/usr/local"
            export WHEEL_DIR="${{ env.SOURCE_DIR }}/${{ env.WHEEL_DIR_REL }}"
            export PIP_INDEX="${{ env.PIP_INDEX }}"
            export TRITON_INDEX="${{ env.PIP_INDEX }}"
            export TRITON_VERSION="${{ env.TRITON_VERSION }}"
            cd "${{ env.SOURCE_DIR }}"

            source .ci/ppu/sdk_env.sh
            source .ci/ppu/install_pccl.sh
            bash .ci/ppu/install_wheel.sh
            bash .ci/ppu/install_triton.sh

            echo "=== Environment self-check (CUDA) ==="
            echo "hostname=$(hostname) node=${NODE_NAME:-unknown}"
            python --version
            (cd /tmp && python -c "import torch; print('torch', torch.__version__, torch.__file__); print('cuda_available', torch.cuda.is_available()); print('device_count', torch.cuda.device_count())")
            ppu-smi || echo "[warn] ppu-smi unavailable; please confirm the pod has been allocated a PPU device"

            bash .ci/ppu/install_test_deps.sh

            echo "=== 810E single card test/test_transformers.py (full, no filtering) ==="
            python test/run_test.py \
                --include test_transformers \
                --verbose
            echo "[transformers-test] Done"
            PPU_TRANSFORMERS_TEST